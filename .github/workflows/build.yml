name: Build Screen Off APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/screenoff/quick
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenOff"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.screenoff.quick'
              compileSdk 34
              defaultConfig {
                  applicationId "com.screenoff.quick"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Screen Off"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:noHistory="true"
                      android:theme="@style/TransparentTheme"
                      android:launchMode="singleInstance"
                      android:taskAffinity=""
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".SetupActivity"
                      android:exported="false"
                      android:label="Setup" />
                  <service
                      android:name=".LockAccessibilityService"
                      android:label="Screen Off"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:notificationTimeout="100"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Screen Off</string>
              <string name="accessibility_description">App icon tap karne par screen lock karne ke liye permission.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="TransparentTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:windowDisablePreview">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1F2937" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,28a26,26 0 1,0 0,52a26,26 0 1,0 0,-52zM54,36a18,18 0 1,1 0,36a18,18 0 1,1 0,-36z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,30L78,78L72,84L24,36z" />
          </vector>
          EOF

          cat > app/src/main/java/com/screenoff/quick/LockAccessibilityService.java << 'EOF'
          package com.screenoff.quick;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          public class LockAccessibilityService extends AccessibilityService {
              private static LockAccessibilityService instance;

              public static LockAccessibilityService getInstance() {
                  return instance;
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public boolean onUnbind(android.content.Intent intent) {
                  instance = null;
                  return super.onUnbind(intent);
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              public boolean lockScreen() {
                  return performGlobalAction(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/screenoff/quick/MainActivity.java << 'EOF'
          package com.screenoff.quick;

          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LockAccessibilityService service = LockAccessibilityService.getInstance();
                  if (service != null) {
                      service.lockScreen();
                  } else {
                      Toast.makeText(this,
                              "Pehle Accessibility me 'Screen Off' enable karo",
                              Toast.LENGTH_LONG).show();
                      startActivity(new Intent(this, SetupActivity.class));
                  }
                  finish();
              }
          }
          EOF

          cat > app/src/main/java/com/screenoff/quick/SetupActivity.java << 'EOF'
          package com.screenoff.quick;

          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class SetupActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 80, 50, 50);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("Screen Off — Setup");
                  title.setTextSize(24);
                  layout.addView(title);

                  TextView desc = new TextView(this);
                  desc.setText("\nApp icon tap karte hi screen off ho jayegi.\n\n" +
                          "1. Neeche button dabao\n" +
                          "2. List me 'Screen Off' dhundo\n" +
                          "3. ON karo\n" +
                          "4. Bas! Ab launcher me icon tap karo = screen off 🔒");
                  desc.setTextSize(15);
                  desc.setPadding(0, 30, 0, 30);
                  layout.addView(desc);

                  Button btn = new Button(this);
                  btn.setText("Open Accessibility Settings");
                  btn.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  layout.addView(btn);

                  setContentView(layout);
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOff-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
